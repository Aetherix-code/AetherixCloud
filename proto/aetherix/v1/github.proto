// GitHubService: GitHub App setup and repository access.
//
// OWNERSHIP: implemented by the github/build worker. Webhooks are NOT part of
// this gRPC surface: they arrive as plain HTTP at /api/github/webhook.
syntax = "proto3";

package aetherix.v1;

import "google/protobuf/timestamp.proto";

service GitHubService {
  // GetApp returns whether the GitHub App is configured (no secrets).
  rpc GetApp(GetAppRequest) returns (GetAppResponse);
  // BeginManifestSetup returns the manifest JSON + the URL to POST it to
  // (GitHub App manifest flow).
  rpc BeginManifestSetup(BeginManifestSetupRequest) returns (BeginManifestSetupResponse);
  // CompleteManifestSetup exchanges the temporary code for app credentials and
  // stores them encrypted.
  rpc CompleteManifestSetup(CompleteManifestSetupRequest) returns (CompleteManifestSetupResponse);
  rpc ListInstallations(ListInstallationsRequest) returns (ListInstallationsResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  // SimulatePush fetches the latest commit of the service's branch via the
  // GitHub API and runs the real build+deploy pipeline (`ax dev push`).
  rpc SimulatePush(SimulatePushRequest) returns (SimulatePushResponse);
  rpc SetWebhookUrl(SetWebhookUrlRequest) returns (SetWebhookUrlResponse);
  // DisconnectApp removes the stored App credentials and cached installations
  // from the cluster. It does not delete the App on GitHub.
  rpc DisconnectApp(DisconnectAppRequest) returns (DisconnectAppResponse);
}

message GetAppRequest {}
message GetAppResponse {
  bool configured = 1;
  int64 app_id = 2;
  string slug = 3;
  string html_url = 4;
  string webhook_url = 5;
}

message BeginManifestSetupRequest {
  string base_url = 1;  // public dashboard URL
  string organization = 2;
}
message BeginManifestSetupResponse {
  string manifest_json = 1;
  string post_url = 2;
  string state = 3;
}

message CompleteManifestSetupRequest {
  string code = 1;
  string state = 2;
}
message CompleteManifestSetupResponse {
  GetAppResponse app = 1;
}

message Installation {
  int64 id = 1;
  string account = 2;
  string account_type = 3;
  google.protobuf.Timestamp created_at = 4;
}
message ListInstallationsRequest {}
message ListInstallationsResponse {
  repeated Installation installations = 1;
}

message Repository {
  string full_name = 1;
  string default_branch = 2;
  bool private = 3;
  int64 installation_id = 4;
}
message ListRepositoriesRequest {
  int64 installation_id = 1;
  string query = 2;
}
message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

message ListBranchesRequest {
  int64 installation_id = 1;
  string repo = 2;
}
message ListBranchesResponse {
  repeated string branches = 1;
}

message SimulatePushRequest {
  string service_id = 1;
  string ref = 2;  // "" => service branch
}
message SimulatePushResponse {
  string build_id = 1;
  string commit_sha = 2;
}

message SetWebhookUrlRequest {
  string url = 1;
}
message SetWebhookUrlResponse {}

message DisconnectAppRequest {
  bool confirm = 1;  // must be true
}
message DisconnectAppResponse {}
