# Multi-arch releases for aetherixd + ax.
# Builds the SPA first (`make web`) so go:embed ships the dashboard.
#
#   goreleaser release --clean
#   goreleaser release --snapshot --clean
#
# CGO is forced off so the embedded registry builds on every target.
# Optional CI: run deploy/caddy/build.sh per arch and place
# dist/caddy_linux_{amd64,arm64}.tar.gz so install.sh prefers that binary.

version: 2

project_name: aetherixcloud

before:
  hooks:
    - make web
    - go mod tidy

builds:
  - id: aetherixd
    main: ./cmd/aetherixd
    binary: aetherixd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: ax-linux
    main: ./cmd/ax
    binary: ax
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: ax-darwin
    main: ./cmd/ax
    binary: ax
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  # Linux: aetherixd + ax (matches deploy/install.sh asset names).
  - id: linux
    ids:
      - aetherixd
      - ax-linux
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files:
      - deploy/aetherixd.service
      - deploy/install.sh
      - deploy/docker-daemon.json
      - README.md
      - docs/**/*
  # Darwin: ax CLI only (daemon is Linux).
  - id: darwin
    ids:
      - ax-darwin
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: Aetherix-code
    name: AetherixCloud
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ .Tag }}-next"
